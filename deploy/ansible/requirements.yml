---
# Exact pins, installed into ./collections (ansible.cfg collections_path), so
# every run uses these versions and not whatever is in ~/.ansible/collections:
#
#   ansible-galaxy collection install -r requirements.yml
#
# The versions ansible 14.4.0 bundles (ansible-core 2.21).
collections:
  - name: ansible.posix # sysctl, mount, authorized_key
    version: "2.2.2"
  - name: community.docker
    version: "5.3.0"
  - name: community.general # ufw, modprobe, filesystem, locale_gen, homebrew
    version: "13.4.0"
  - name: community.sops # inventory secrets (vars plugin)
    version: "2.4.0"
