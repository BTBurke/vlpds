# Read-only, filtered Docker API for Alloy (roles/alloy, alloy_docker_socket_proxy).
# Allowed, GET/HEAD only: ping and version (API negotiation), the network
# list, the container list and inspect (both cut down to an allowlist of
# fields by docker-proxy-filter.js: no Env, Cmd or Mounts), and container
# logs. Everything else is 403.

load_module modules/ngx_http_js_module.so;

daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    # The container's root filesystem is read-only.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Only refusals and errors: a denied path means Alloy (or someone else)
    # asked for something this proxy does not serve.
    map $status $docker_proxy_log {
        ~^[23]  0;
        default 1;
    }
    access_log /dev/stdout combined if=$docker_proxy_log;

    js_import filter from /etc/nginx/docker-proxy-filter.js;
    # Inspect responses are buffered whole for filtering.
    subrequest_output_buffer_size 4m;

    upstream docker {
        server unix:/var/run/docker.sock;
    }

    proxy_http_version 1.1;
    proxy_set_header Host docker;
    proxy_set_header Connection "";
    proxy_buffering off;
    # Followed logs can stay silent for hours.
    proxy_read_timeout 1d;

    server {
        listen unix:/sock/docker.sock;

        # Requests go upstream as the normalised, matched $uri, never the
        # client's raw request line.
        location ~ ^/(v[0-9.]+/)?(_ping|version|networks)$ {
            limit_except GET { deny all; }
            proxy_pass http://docker$uri$is_args$args;
        }

        location ~ ^/(v[0-9.]+/)?containers/[A-Za-z0-9][A-Za-z0-9_.-]*/logs$ {
            limit_except GET { deny all; }
            proxy_pass http://docker$uri$is_args$args;
        }

        location ~ ^/(v[0-9.]+/)?containers/json$ {
            limit_except GET { deny all; }
            js_content filter.containerList;
        }

        location ~ ^/(v[0-9.]+/)?containers/[A-Za-z0-9][A-Za-z0-9_.-]*/json$ {
            limit_except GET { deny all; }
            js_content filter.containerInspect;
        }

        location ~ ^/_docker(/.*)$ {
            internal;
            proxy_buffering on;
            proxy_pass http://docker$1$is_args$args;
        }

        location / {
            return 403;
        }
    }
}
