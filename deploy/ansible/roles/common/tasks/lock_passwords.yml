---
# Lock the passwords of the image's login accounts (usermod -L). The
# accounts stay (provider tooling may expect them), with their groups and
# any keys; sshd's AllowUsers keeps them off SSH anyway. Only accounts that
# exist are touched (the user module would create a missing one).
- name: Read the account database
  ansible.builtin.getent:
    database: passwd

- name: Lock passwords
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
  loop: "{{ common_lock_password_users | select('in', ansible_facts.getent_passwd) | list }}"
