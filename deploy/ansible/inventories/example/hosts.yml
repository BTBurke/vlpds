---
# One small VPS serving pds.example.com. Copy this directory to
# inventories/<name>/ and edit it; ../../README.md walks through it.
#
#   ansible-playbook -i inventories/<name>/hosts.yml playbooks/bootstrap.yml --limit pds1
#   ansible-playbook -i inventories/<name>/hosts.yml playbooks/vlpds.yml --check --diff
all:
  children:
    vlpds:
      hosts:
        # 2-4 vCPU, 4-8 GB RAM, 40+ GB disk, a current Ubuntu LTS.
        pds1:
          ansible_host: 203.0.113.10
          # First login (playbooks/bootstrap.yml only): the image's own
          # account, with the provider's initial password.
          bootstrap_user: ubuntu
