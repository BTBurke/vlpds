[defaults]
inventory = inventories/example/hosts.yml
remote_user = operator
retry_files_enabled = False
roles_path = roles
# requirements.yml pins land here (`ansible-galaxy collection install -r
# requirements.yml`), so stale collections elsewhere can't shadow them.
collections_path = collections
# Secrets: group_vars/<group>.sops.yaml and host_vars/<host>.sops.yaml are
# decrypted by community.sops. They sit next to (not inside) any
# group_vars/<group>/ directory, so host_group_vars never reads their
# ciphertext as variables.
vars_plugins_enabled = host_group_vars,community.sops.sops
host_key_checking = True
gathering = smart

[privilege_escalation]
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# Host keys come from ./known_hosts (commit it) and must match;
# playbooks/bootstrap.yml adds a fresh host's key on first contact.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=known_hosts
ssh_common_args = -o StrictHostKeyChecking=yes
