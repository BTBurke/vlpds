[package]
name = "vlpds"
version = "0.1.0"
edition = "2021"
# tests/ is one binary (tests/all/main.rs), declared below: one link per run
# instead of one per file.
autotests = false

[features]
default = ["jemalloc", "slatedb-metrics"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# The test binary (benches) on jemalloc, the server's allocator: the system
# allocator costs an export ~1.5x the instructions (DESIGN "Measured")
bench-jemalloc = ["jemalloc"]
# A/B alternative: cargo build --release --no-default-features --features mimalloc
mimalloc = ["dep:mimalloc"]
# CPU profiling (bench/obs/README.md): --pyroscope-url pushes 100 Hz pprof-rs
# samples to a Pyroscope server; GET /debug/pprof/profile (admin) serves one
# on demand. Both use pyroscope's pprof-rs backend (the standalone pprof
# crate's SIGPROF handler symbol collides with it), one at a time.
profiling = ["dep:pyroscope", "dep:prost", "dep:inferno"]
# SlateDB's own stats (block cache hits, memtable, L0, flushes) in /metrics
slatedb-metrics = ["dep:slatedb-common"]
# TEST ONLY, never in a release image: adds the test feature level
# (src/version.rs TEST_LEVEL = newest real level + 1), which changes the
# segment magic/header and a retain/ report field, so rolling upgrades are
# exercised with a real format change (tests/level_gating.rs, bench/ha
# upgrade-* scenarios, `just upgrade-ci`).
test-level = []

[dependencies]
# zstd/lz4: SST block compression (--sst-compression, default zstd)
slatedb = { version = "0.17", features = ["aws", "wal_disable", "zstd", "lz4"] }
# log segment body compression (src/segment.rs; the same zstd SlateDB links)
zstd = "0.13"
# decoding gzip/deflate AppView responses for read-after-write munging (the
# flate2 tower-http already links)
flate2 = "1"
# brotli (`br`) decoding of proxied AppView bodies for read-after-write
brotli-decompressor = "5"
object_store = { version = "0.14", features = ["aws"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros", "http2"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# K-256 signing/verification: libsecp256k1 (vendored C via cc), ~1.7x
# faster signing and ~2.7x faster verification than RustCrypto k256.
secp256k1 = { version = "0.30", features = ["global-context"] }
sha2 = { version = "0.10", features = ["asm"] }
rand = "0.8"
# explicit-slur handle filter (src/handle_policy.rs; the reference's regexes)
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
lru = "0.12"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
futures = "0.3"
hdrhistogram = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls", "stream"] }
tokio-tungstenite = "0.26"
tikv-jemallocator = { version = "0.7", optional = true }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"], optional = true }
mimalloc = { version = "0.1", optional = true }
pyroscope = { version = "2.1", default-features = false, features = ["backend-pprof-rs"], optional = true }
prost = { version = "0.14", optional = true }
inferno = { version = "0.11", default-features = false, optional = true }
slatedb-common = { version = "0.17", optional = true }
prometheus = { version = "0.14", default-features = false }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
bs58 = "0.5"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# OAuth (src/oauth): ES256 (P-256) for DPoP proofs, client assertions and access tokens;
# DNS TXT lookups for lexicon authority resolution (include: permission sets).
p256 = { version = "0.13", features = ["ecdsa"] }
hickory-resolver = "0.25"
# HTTP: server-wide CORS, response compression (json/car) and request
# Content-Encoding decoding, as the reference PDS does.
# grapheme counts for lexicon maxGraphemes (src/lexicon.rs)
unicode-segmentation = "1"
tower = { version = "0.5", features = ["util"] }
# embedded web UI (ui/dist, built by `just ui`; build.rs leaves a placeholder)
rust-embed = { version = "8", features = ["mime-guess"] }
tower-http = { version = "0.6", features = ["compression-gzip", "decompression-gzip", "decompression-deflate"] }
# outbound email (src/mail.rs): async SMTP over rustls (ring, webpki roots), no native-tls
# secrets at rest (src/secrets.rs): XChaCha20-Poly1305 under the local KEK;
# unwrapped key material is zeroized on drop
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
# GCP service-account JWTs (RS256) for Cloud KMS tokens (src/secrets.rs);
# already in the tree via rustls
ring = "0.17"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }

[[test]]
name = "all"
path = "tests/all/main.rs"

# Rolling upgrades with the test feature level: its own binary (the active
# level is process-wide), so `cargo test --features test-level --test level_gating`
[[test]]
name = "level_gating"
path = "tests/level_gating.rs"
required-features = ["test-level"]

# slatedb 0.17.0 (upstream c1e36fc) plus one fix, on the fork branch
# vlpds-0.17-union-l0-view-ids (pending an upstream report): a union clone (a
# shard merge) of two sources that inherited the same L0 SST from a common
# ancestor (a split's halves merged back) repeated its L0 view id, and the
# merged shard's first compaction of it dropped one half's keys
# (Manifest::cloned_from_union now gives repeats fresh ids). DESIGN.md
# "Online shard split/merge", "Patched SlateDB".
[patch.crates-io]
# LOCAL (iterfast): repoint to the fork rev of branch vlpds-0.17-batch-next once pushed
slatedb = { path = "/tmp/scratch/slatedb-iterfast/slatedb" }
# the same rev, so the metrics recorder (src/metrics.rs) and slatedb share one slatedb-common
slatedb-common = { path = "/tmp/scratch/slatedb-iterfast/slatedb-common" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# keep symbols for profiling (sample/perf/pprof)
debug = 1

# fast iteration builds: `cargo build --profile dev-release`. No LTO and
# incremental, so an edit recompiles only the crate; dependencies are built
# once at full opt-level and cached. Benches/deploys use --release.
[profile.dev-release]
inherits = "release"
opt-level = 2
lto = false
debug = "line-tables-only"
codegen-units = 256
incremental = true

[profile.dev-release.package."*"]
opt-level = 3

# `cargo test` (tests/STATUS.md): quick to build and link, still fast enough
# to run (crypto, CBOR and MST code is slow at opt-level 0).
[profile.test]
opt-level = 1
debug = 0
lto = false
codegen-units = 16
incremental = true

[profile.test.package."*"]
opt-level = 2

[dev-dependencies]
# brotli-encoded stub AppView bodies (read-after-write tests)
brotli = "8"
# tests cross-check libsecp256k1 signatures against RustCrypto
k256 = { version = "0.13", features = ["ecdsa"] }
# differential tests (tests/all/differential_shrike.rs): a second atproto
# implementation (DAG-CBOR, CID, CAR, MST, proofs, crypto, syntax, lexicon)
shrike = { version = "=0.7.0", default-features = false, features = ["syntax", "cbor", "crypto", "mst", "repo", "car", "lexicon"] }
