apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # matches the 1 s scrape: $__rate_interval = 4 s, panels can resolve 1 s
      timeInterval: 1s
      httpMethod: POST
      prometheusType: Prometheus
  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
