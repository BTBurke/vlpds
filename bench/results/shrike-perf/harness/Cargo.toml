[package]
name = "shrike-perf"
version = "0.1.0"
edition = "2024"
publish = false

# Build modes (see README.md):
#   cargo run --release                         shrike as shipped (its own sha2 features)
#   cargo run --release --features sha2-asm     shrike with sha2's aarch64 SHA-256 instructions
#   cargo run --release --features compare      shrike vs the independent implementation
[features]
default = []
compare = ["dep:vlpds"]
sha2-asm = ["dep:sha2", "sha2/asm"]

[dependencies]
shrike = { version = "=0.7.0", default-features = false, features = ["syntax", "cbor", "crypto", "mst", "repo", "car", "lexicon", "streaming"] }
serde_json = "1"
secp256k1 = { version = "0.30", features = ["global-context"] }
sha2 = { version = "0.10", optional = true }
rand = "0.8"
bumpalo = "3"
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
# the comparison implementation (not public); only with --features compare
vlpds = { path = "../../../..", default-features = false, optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
